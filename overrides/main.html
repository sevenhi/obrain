{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script>
  (function () {
    if (window.__obReader) {
      window.__obReader();
      return;
    }

    var labels = {
      'obrain - 个人大脑': '首页',
      'Attention': 'Attention',
      'Computer vision': '计算机视觉',
      'Cutlass': 'CUTLASS',
      'Deepseek infra': 'DeepSeek',
      'Deepseek models': 'DeepSeek',
      'Deepseek vision': 'DeepSeek',
      'Gpu rng': 'GPU 随机数',
      'Model architecture': '模型架构',
      'Quantization': '量化与压缩',
      'Vllm': 'vLLM'
    };

    function init() {
      var isHome = document.title.indexOf('obrain - 个人大脑') === 0;
      document.body.classList.toggle('ob-home', isHome);

      var internalHeadings = /^(相关条目|关键事实速记|已知缺口|溯源|阅读顺序建议)/;
      document.querySelectorAll('.md-content h2').forEach(function (heading) {
        if (!internalHeadings.test(heading.textContent.trim())) return;
        var node = heading;
        while (node) {
          var next = node.nextElementSibling;
          node.remove();
          if (next && next.tagName === 'H2') break;
          node = next;
        }
      });
      document.querySelectorAll('.md-sidebar--secondary .md-nav__link').forEach(function (link) {
        if (internalHeadings.test(link.textContent.trim())) {
          var item = link.closest('.md-nav__item');
          if (item) item.remove();
        }
      });

      var primaryList = document.querySelector('.md-nav--primary > .md-nav__list');
      if (primaryList) {
        primaryList.querySelectorAll('.ob-nav-current').forEach(function (item) {
          item.classList.remove('ob-nav-current');
        });
        document.body.classList.remove('ob-nav-focused');
        var active = primaryList.querySelector('.md-nav__item--active');
        if (active) {
          var section = active;
          while (section.parentElement && section.parentElement !== primaryList) {
            section = section.parentElement.closest('.md-nav__item') || section;
          }
          if (section.parentElement === primaryList && section.classList.contains('md-nav__item--section')) {
            section.classList.add('ob-nav-current');
            document.body.classList.add('ob-nav-focused');
          }
        }
      }

      document.querySelectorAll('.md-tabs__link, .md-nav--primary > .md-nav__list > .md-nav__item > .md-nav__link').forEach(function (link) {
        var title = link.querySelector('.md-ellipsis') || link;
        var label = labels[title.textContent.trim()];
        if (label) title.textContent = label;
      });

      var primaryItems = Array.prototype.slice.call(document.querySelectorAll('.md-nav--primary > .md-nav__list > .md-nav__item'));
      document.querySelectorAll('.md-tabs__item').forEach(function (tab) {
        var tabLink = tab.querySelector('.md-tabs__link');
        if (tabLink && (tabLink.getAttribute('href') === '.' || tabLink.getAttribute('href') === './')) {
          tab.remove();
          return;
        }
        if (tab.querySelector('.ob-mega-menu')) return;
        if (!tabLink) return;
        var target = tabLink.getAttribute('href');
        var source = primaryItems.find(function (item) {
          var link = item.querySelector(':scope > .md-nav__link');
          return link && link.getAttribute('href') === target;
        });
        var submenu = source && source.querySelector('.md-nav');
        if (!submenu) return;
        var menu = document.createElement('div');
        menu.className = 'ob-mega-menu';
        var list = submenu.querySelector(':scope > .md-nav__list');
        if (list) menu.appendChild(list.cloneNode(true));
        tab.appendChild(menu);
      });

      var deepseekTabs = Array.prototype.slice.call(document.querySelectorAll('.md-tabs__item')).filter(function (tab) {
        var link = tab.querySelector('.md-tabs__link');
        return link && /deepseek-(infra|models|vision)/.test(link.getAttribute('href'));
      });
      if (deepseekTabs.length > 1) {
        var deepseekTab = deepseekTabs[0];
        var deepseekMenu = deepseekTab.querySelector('.ob-mega-menu');
        deepseekTabs.slice(1).forEach(function (tab) {
          var menu = tab.querySelector('.ob-mega-menu');
          var list = menu && menu.querySelector('.md-nav__list');
          if (deepseekMenu && list) {
            Array.prototype.slice.call(list.children).forEach(function (item) {
              deepseekMenu.querySelector('.md-nav__list').appendChild(item);
            });
          }
          tab.remove();
        });
        var deepseekLabel = deepseekTab.querySelector('.md-ellipsis') || deepseekTab.querySelector('.md-tabs__link');
        if (deepseekLabel) deepseekLabel.textContent = 'DeepSeek';
      }

      document.querySelectorAll('.md-content iframe[src]').forEach(function (frame) {
        if (frame.dataset.obPreview) return;
        var source = new URL(frame.getAttribute('src'), document.baseURI);
        if (!source.pathname.includes('/diagrams/') || !source.pathname.endsWith('.html')) return;

        document.body.classList.add('ob-has-diagram');

        var figure = frame.closest('.archify-figure');
        if (!figure) {
          figure = document.createElement('div');
          figure.className = 'archify-figure';
          frame.replaceWith(figure);
          figure.appendChild(frame);
        }

        var caption = document.createElement('p');
        caption.className = 'ob-figure-caption';
        var link = document.createElement('a');
        link.href = source.href;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '独立打开原图（新窗口）：' + (frame.title || '交互图');
        caption.append('有界交互预览，可在图内滚动。', link);
        figure.insertBefore(caption, frame);
        frame.style.removeProperty('height');
        frame.removeAttribute('height');
        frame.loading = 'lazy';
        frame.dataset.obPreview = '1';
      });
    }

    window.__obReader = init;
    if (typeof document$ !== 'undefined' && document$.subscribe) {
      document$.subscribe(init);
    } else if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })();
  </script>
{% endblock %}
